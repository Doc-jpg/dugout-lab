# The sync database is a free Supabase project shared with Athletic Lab, which pauses after a week
# with no traffic. This pings Dugout Lab's table every three days so it stays awake. A failing run
# means it paused anyway; restoring it is one click at https://supabase.com/dashboard/project/kdulamsgpgozryacmhok
name: Keep the sync database awake
on:
  schedule:
    - cron: '41 10 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the dugout_records endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://kdulamsgpgozryacmhok.supabase.co/rest/v1/dugout_records?select=id&limit=1" \
            -H "apikey: sb_publishable_L-BWbmrV7Ss1aRJW_Et0Kg_G0EU0dtB" \
            -H "Authorization: Bearer sb_publishable_L-BWbmrV7Ss1aRJW_Et0Kg_G0EU0dtB" \
            -H "x-team-key: keepalive-ping-0000000000" \
            -H "x-coach-token: keepalive-ping-0000000000")
          echo "HTTP $code"
          test "$code" = "200"
